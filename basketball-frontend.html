<!DOCTYPE html>
<html>

<head>
	<title>Basketball Scorebug 5200x1080</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

	<style>
		/* Main */
		body {
			margin: 0;
			padding: 0;
			background: transparent;
			font-family: "Rubik", sans-serif;
			font-style: italic;
			font-weight: 600;
			color: white;
		}

		/* Same spot the old PNG occupied on the 5200x1080 canvas. */
		#scoreboard {
			position: absolute;
			top: 300px;
			left: 1600px;
			width: 1920px;
			height: 747px;
			z-index: 2;
		}

		/* Translate moves the entire scoreboard over */
		.world {
			position: absolute;
			left: 0;
			top: 0;
			width: 1920px;
			height: 1080px;
			transform: translate(14px, -91px);
		}

		/* Shapes */
		.slab {
			position: absolute;
			box-sizing: border-box;
			transform-origin: 0 100%;
			transform: matrix(1, 0, calc(-1 * var(--t)), 1, 0, 0);
		}

		.plate {
			overflow: hidden;
			z-index: 1;
		}

		#guest-plate {
			--t: 0.2143;
			left: 149.3px;
			top: 216.9px;
			width: 793.3px;
			height: 233px;
			background: #999;
			box-shadow: 0 0 0 25px #000;
		}

		/* Fill + gradient ring.
			The ring is a transparent border painted with its own gradient
			(because somewhat annoyingly, box-shadow can't do gradients). */
		#home-plate {
			--t: 0.2143;
			/* --home-ring: linear-gradient(60deg, rgba(215, 213, 210, .25) 0%, rgba(138, 21, 56, 0.89) 25%,
					rgba(112, 121, 128, .48) 50%, rgba(138, 21, 56, 0.45) 75%, rgba(138, 21, 56, 1.00) 100%); */
			--home-ring: linear-gradient(60deg, rgba(252, 252, 252, 0.692) 0%, rgba(138, 21, 56, 0.95) 25%,
					rgba(245, 245, 245, 0.75) 50%, rgba(138, 21, 56, 0.9) 75%, rgba(138, 21, 56, 1.00) 100%);
			left: 996px;
			top: 191.9px;
			width: 843.3px;
			height: 283px;
			border: 25px solid transparent;
			background:
				linear-gradient(104deg,
					#8A1538 0%, #901739 5.6%, #A21B3B 13.2%, #B8213D 20.3%, #A61C3B 28.6%,
					#8A1538 42.8%, #901739 48.3%, #A21B3A 55.8%, #A81D3B 57.7%, #9E1A3A 61.2%,
					#911738 67.9%, #8D1638 74.1%, #A01B3A 86.7%, #A61C3B 90%, #921739 95.9%, #8A1538 100%) padding-box,
				var(--home-ring) border-box;
		}

		/* Score sheen sweep effect. */
		.plate::after {
			content: "";
			position: absolute;
			inset: 0;
			background: linear-gradient(100deg, transparent 38%, rgba(255, 255, 255, 0.6) 50%, transparent 62%);
			background-size: 250% 100%;
			background-position: 0% 0;
			pointer-events: none;
		}

		.plate.scored::after {
			animation: sheen 1.1s ease-out;
		}

		@keyframes sheen {
			from {
				background-position: 100% 0;
			}

			to {
				background-position: 0% 0;
			}
		}

		#clock-plate {
			--t: 0.2221;
			left: 40.9px;
			top: 620.5px;
			width: 1400.3px;
			height: 211px;
			border: 12px solid transparent;
			background:
				linear-gradient(353deg, #5E6972 0%, #69747C 40%, #7C858C 70%, #959DA2 100%) padding-box,
				linear-gradient(339deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 18%, rgba(0, 0, 0, 1) 31%, rgba(28, 28, 28, .57) 43%,
					rgba(51, 51, 51, .46) 54%, rgba(80, 80, 80, .36) 64%, rgba(115, 115, 115, .26) 74%,
					rgba(158, 158, 158, .17) 83%, rgba(206, 206, 206, .08) 92%, rgba(255, 255, 255, 0) 100%) border-box;
		}

		#shot-plate {
			--t: 0.2226;
			left: 1454.1px;
			top: 620.5px;
			width: 307.7px;
			height: 211px;
			border: 12px solid transparent;
			background:
				linear-gradient(199deg, #858A8C 0%, #727A7F 35%, #656F77 65%, #5D6971 100%) padding-box,
				linear-gradient(34deg, rgba(215, 213, 210, .25), rgba(179, 181, 181, .3) 7%, rgba(151, 156, 160, .36) 14%,
					rgba(129, 137, 142, .41) 22%, rgba(112, 121, 128, .48) 31%, rgba(100, 111, 119, .57) 43%,
					rgba(93, 105, 114, .69) 58%, #5B6770) border-box;
		}

		/* timeouts / fouls */
		.strip {
			--t: 0.21;
			top: 488.2px;
			height: 118px;
			z-index: 1;
		}

		#guest-strip {
			left: 94.4px;
			width: 842.2px;
			background: #999;
			box-shadow: 0 0 0 0.5px #000;
		}

		#home-strip {
			left: 968px;
			width: 840.3px;
			background: #8A1538;
		}

		/* Strip call-out (foul / timeout) */

		/* Dim the strip contents while a call-out is swiping across.
		visibility (with a delayed transition) is used so the blink animation
		on the foul numbers can't keep them visible during the fade-out. */
		.t.label,
		.t.timeouts,
		.t.fouls {
			transition: opacity 0.3s ease, visibility 0s linear 0s;
		}

		.t.label.dimmed,
		.t.timeouts.dimmed,
		.t.fouls.dimmed {
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.3s ease, visibility 0s linear 0.3s;
		}

		/* Overlay that sits exactly on top of the strip. Same --t / left / top /
		width / height as the strip so it clips to the same parallelogram. */
		.strip-fx {
			--t: 0.21;
			top: 488.2px;
			height: 118px;
			overflow: hidden;
			pointer-events: none;
			z-index: 5;
			opacity: 0;
			transition: opacity 0.25s ease;
		}

		#guest-strip-fx {
			left: 94.4px;
			width: 842.2px;
		}

		#home-strip-fx {
			left: 968px;
			width: 840.3px;
		}

		.strip-fx.active {
			opacity: 1;
		}

		/* The text is counter-skewed so it reads upright, and slides the full
		width of the strip (translate % is relative to the text box = strip width). */
		.strip-fx .fx-text {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 96px;
			font-weight: 800;
			letter-spacing: 6px;
			color: #fff;
			text-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
			transform: translateX(-115%) skewX(11.86deg);
		}

		.strip-fx.active .fx-text {
			animation: stripSwipe 1.6s cubic-bezier(0.22, 0.7, 0.3, 1) forwards;
		}

		@keyframes stripSwipe {
			0% {
				transform: translateX(-115%) skewX(11.86deg);
				opacity: 0;
			}

			10% {
				opacity: 1;
			}

			30% {
				transform: translateX(0%) skewX(11.86deg);
				opacity: 1;
			}

			70% {
				transform: translateX(0%) skewX(11.86deg);
				opacity: 1;
			}

			90% {
				opacity: 1;
			}

			100% {
				transform: translateX(115%) skewX(11.86deg);
				opacity: 0;
			}
		}

		/* Light sheen that sweeps the strip at the same time */
		.strip-fx::before {
			content: "";
			position: absolute;
			inset: 0;
			background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, 0.45) 50%, transparent 65%);
			background-size: 250% 100%;
			background-position: 100% 0;
			opacity: 0;
		}

		.strip-fx.active::before {
			opacity: 1;
			animation: stripSheen 1.6s ease-out forwards;
		}

		@keyframes stripSheen {
			from {
				background-position: 100% 0;
			}

			to {
				background-position: -80% 0;
			}
		}

		/* Red glow that pulses on the shot-clock border during the 10s countdown.
		   Sits exactly on top of #shot-plate's ring so the glow hugs the frame. */
		#shot-clock-glow {
			--t: 0.2226;
			left: 1454.1px;
			top: 620.5px;
			width: 307.7px;
			height: 211px;
			border: 12px solid transparent;
			pointer-events: none;
			z-index: 4;
		}

		#shot-clock-glow.active {
			animation: shotClockGlow 1s ease-in-out infinite;
		}

		@keyframes shotClockGlow {

			0%,
			100% {
				border-color: rgba(255, 46, 34, 0.10);
				box-shadow: 0 0 10px 0 rgba(255, 20, 10, 0.25);
			}

			50% {
				border-color: rgba(255, 46, 34, 0.90);
				box-shadow: 0 0 38px 8px rgba(255, 30, 10, 0.75);
			}
		}

		/* Countdown fill: inset by the full 12px border so it lives INSIDE the ring */
		#shot-clock-countdown {
			--t: 0.2226;
			left: 1468.8px;
			top: 632.5px;
			width: 283.7px;
			height: 187px;
			display: none;
			overflow: hidden;
			z-index: 3;
		}

		#shot-clock-fill {
			width: 100%;
			height: 100%;
			background: rgba(255, 0, 0, 0.5);
			transform-origin: bottom;
		}

		#pc-logo {
			position: absolute;
			left: 1563px;
			top: 147px;
			width: 300px;
			overflow: visible;
			z-index: 2;
		}

		/* On-fire effect */
		.fire {
			--t: 0.2143;
			z-index: 0;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.7s ease;
		}

		.fire.active {
			opacity: 1;
		}

		#guest-fire {
			left: 149.3px;
			top: 216.9px;
			width: 793.3px;
			height: 233px;
		}

		#home-fire {
			left: 996px;
			top: 191.9px;
			width: 843.3px;
			height: 283px;
		}

		/* Soft heat haze halo behind the whole plate */
		.fire-glow {
			position: absolute;
			left: -12%;
			top: -65%;
			width: 124%;
			height: 180%;
			background: radial-gradient(ellipse at 50% 72%,
					rgba(255, 140, 20, 0.55) 0%,
					rgba(255, 70, 0, 0.34) 34%,
					rgba(210, 25, 0, 0.14) 58%,
					rgba(255, 0, 0, 0) 78%);
			filter: blur(16px);
			animation: fireGlowPulse 1.8s ease-in-out infinite alternate;
		}

		@keyframes fireGlowPulse {
			from {
				opacity: 0.55;
				transform: scale(0.97);
			}

			to {
				opacity: 1;
				transform: scale(1.03);
			}
		}

		.flame {
			position: absolute;
			bottom: 88%;
			left: var(--x, 8%);
			width: var(--w, 80px);
			height: var(--h, 160px);
			margin-left: calc(-0.5 * var(--w, 80px));
			border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
			background: radial-gradient(ellipse 60% 45% at 50% 82%,
					rgba(255, 255, 232, 0.95) 0%,
					rgba(255, 232, 132, 0.92) 20%,
					rgba(255, 172, 42, 0.80) 42%,
					rgba(255, 92, 10, 0.50) 65%,
					rgba(255, 40, 0, 0) 85%);
			filter: blur(5px);
			transform-origin: 50% 100%;
			animation: flameDance var(--dur, 1.1s) ease-in-out infinite alternate;
			animation-delay: var(--delay, 0s);
		}

		@keyframes flameDance {
			0% {
				transform: translateY(8%) scale(0.85, 0.90) rotate(-5deg);
				opacity: 0.55;
			}

			50% {
				transform: translateY(-2%) scale(1.05, 1.06) rotate(2deg);
				opacity: 0.95;
			}

			100% {
				transform: translateY(-16%) scale(0.90, 1.20) rotate(6deg);
				opacity: 0.45;
			}
		}

		/* Per-flame variation (nth-child(1) is .fire-glow) */
		.fire .flame:nth-child(2) {
			--x: 7%;
			--w: 90px;
			--h: 170px;
			--dur: 1.05s;
			--delay: -0.10s;
		}

		.fire .flame:nth-child(3) {
			--x: 21%;
			--w: 70px;
			--h: 140px;
			--dur: 1.35s;
			--delay: -0.45s;
		}

		.fire .flame:nth-child(4) {
			--x: 35%;
			--w: 105px;
			--h: 200px;
			--dur: 0.95s;
			--delay: -0.25s;
		}

		.fire .flame:nth-child(5) {
			--x: 50%;
			--w: 80px;
			--h: 160px;
			--dur: 1.20s;
			--delay: -0.60s;
		}

		.fire .flame:nth-child(6) {
			--x: 65%;
			--w: 95px;
			--h: 185px;
			--dur: 1.10s;
			--delay: -0.35s;
		}

		.fire .flame:nth-child(7) {
			--x: 79%;
			--w: 75px;
			--h: 145px;
			--dur: 1.30s;
			--delay: -0.05s;
		}

		.fire .flame:nth-child(8) {
			--x: 93%;
			--w: 85px;
			--h: 165px;
			--dur: 1.00s;
			--delay: -0.50s;
		}

		.ember {
			position: absolute;
			left: var(--x, 50%);
			bottom: 90%;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: radial-gradient(circle,
					rgba(255, 236, 170, 1) 0%,
					rgba(255, 150, 25, 0.9) 45%,
					rgba(255, 60, 0, 0) 72%);
			filter: blur(1px);
			opacity: 0;
			animation: emberRise var(--edur, 2.6s) linear infinite;
			animation-delay: var(--edelay, 0s);
		}

		.fire .ember:nth-child(9) {
			--x: 15%;
			--edur: 2.6s;
			--edelay: -0.4s;
			--drift: -18px;
		}

		.fire .ember:nth-child(10) {
			--x: 38%;
			--edur: 3.1s;
			--edelay: -1.6s;
			--drift: 24px;
		}

		.fire .ember:nth-child(11) {
			--x: 62%;
			--edur: 2.3s;
			--edelay: -0.9s;
			--drift: -12px;
		}

		.fire .ember:nth-child(12) {
			--x: 85%;
			--edur: 2.9s;
			--edelay: -2.2s;
			--drift: 16px;
		}

		.fire-bed {
			position: absolute;
			left: 4%; right: 4%;
			bottom: 97%;
			height: 135px;
			background: radial-gradient(ellipse 50% 100% at 50% 100%,
				rgba(255, 232, 160, .85) 0%,
				rgba(255, 140, 20, .55) 38%,
				rgba(255, 50, 0, .22) 68%,
				rgba(255, 0, 0, 0) 100%);
			filter: blur(12px);
			animation: bedPulse 1.5s ease-in-out infinite alternate;
			}
			@keyframes bedPulse {
			from { opacity: .6; transform: scaleX(.97); }
			to   { opacity: 1;  transform: scaleX(1.03); }
			}

		@keyframes emberRise {
			0% {
				transform: translate(0, 0) scale(1);
				opacity: 0;
			}

			10% {
				opacity: 1;
			}

			70% {
				opacity: 0.85;
			}

			100% {
				transform: translate(var(--drift, 20px), -280px) scale(0.3);
				opacity: 0;
			}
		}

		/* Don't *burn* the CPU when nobody is on fire */
		.fire:not(.active) .flame,
		.fire:not(.active) .ember,
		.fire:not(.active) .fire-glow {
			animation-play-state: paused;
		}

		/* Text */
		.t {
			position: absolute;
			line-height: 1;
			white-space: nowrap;
			z-index: 4;
		}

		.label {
			font-size: 76px;
			font-weight: 600;
			top: 511px;
			letter-spacing: -2px;
		}

		#guest-tol-label {
			left: 130px;
		}

		#guest-fls-label {
			left: 676px;
		}

		#home-tol-label {
			left: 1015px;
		}

		#home-fls-label {
			left: 1543px;
		}

		/* Stats */
		.stats-animation {
			position: absolute;
			top: 380px;
			width: 1000px;
			height: 661px;
			background: rgb(150, 17, 54, 0.8);
			/* background: rgba(179, 85, 85, 1); */
			transform-origin: bottom;
			transform: skew(-12.5deg) translateX(100%);
			display: none;
			z-index: 1;
		}

		#home-stats-animation {
			left: 2391px;
		}

		#guest-stats-animation {
			left: -363px;
		}

		.stats-text {
			position: absolute;
			width: 100%;
			text-align: center;
			top: 2%;
			transform: skew(5deg) translateX(5px);
			font-size: 89px;
			color: white;
		}

		/* Score */
		.number-ticker {
			overflow: hidden;
			height: 1.042em;
			background: transparent;
			position: absolute;
			font-size: 230px;
			font-weight: 700;
			top: 214px;
			font-family: "Rubik", sans-serif;
			font-style: italic;
			z-index: 4;
		}

		.digit {
			float: left;
			line-height: 1;
			transition: margin-top 3s ease;
			font-variant-numeric: tabular-nums;
		}

		#home-score {
			left: 1102px;
		}

		#guest-score {
			right: 1019px;
		}

		.number-ticker.pop {
			animation: scorePop 0.9s ease-out;
		}

		@keyframes scorePop {
			0% {
				transform: scale(1);
				filter: brightness(1);
			}

			20% {
				transform: scale(1.18);
				filter: brightness(1.6);
			}

			100% {
				transform: scale(1);
				filter: brightness(1);
			}
		}

		/* Possession */
		.possession {
			font-size: 100px;
			font-weight: 700;
			top: 278px;
		}

		#home-possession {
			left: 1056px;
		}

		#guest-possession {
			left: 908px;
		}

		/* Timeouts */
		.timeouts {
			font-size: 114px;
			font-weight: 600;
			top: 491px;
		}

		#home-timeouts {
			left: 1170px;
		}

		#guest-timeouts {
			left: 292px;
		}

		.timeouts span {
			transition: opacity 0.3s ease-in-out;
		}

		.timeouts span.blink {
			animation: blinkTimeout 0.5s ease-in-out 6;
		}

		@keyframes blinkTimeout {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}

		#timeout-animation {
			position: absolute;
			top: 100px;
			left: 1829px;
			width: 1721px;
			height: 140px;
			background: rgba(255, 165, 0, 0.7);
			transform-origin: bottom;
			transform: skew(-12.5deg) translateY(100%);
			display: none;
			z-index: 1;
		}

		#timeout-text {
			position: absolute;
			width: 100%;
			text-align: center;
			top: 50%;
			transform: translateY(-50%) skew(12.5deg);
			/* Counter-skew the text */
			font-size: 122px;
			color: white;
		}

		/* Fouls */
		.fouls {
			font-size: 91px;
			font-weight: 600;
			top: 502px;
		}

		#home-fouls {
			left: 1698px;
		}

		#guest-fouls {
			left: 832px;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}

		.blink {
			animation: blink 0.5s ease-in-out 6;
		}

		/* Clocks */
		#main-clock {
			top: 656px;
			right: 552px;
			font-size: 141px;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
		}

		#period {
			top: 680px;
			left: 100px;
			font-size: 93px;
			font-weight: 500;
		}

		#shot-clock {
			top: 663px;
			left: 1482px;
			width: 296px;
			text-align: center;
			font-size: 125px;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
			z-index: 5;
		}

		/* Digits glow in step with the ring during the countdown */
		#shot-clock.hot {
			animation: shotClockTextGlow 1s ease-in-out infinite;
		}

		@keyframes shotClockTextGlow {

			0%,
			100% {
				text-shadow: 0 0 10px rgba(255, 40, 20, 0.35);
			}

			50% {
				text-shadow: 0 0 28px rgba(255, 60, 30, 0.95), 0 0 60px rgba(255, 0, 0, 0.5);
			}
		}
	</style>
</head>

<body>

	<!JavaScript  ----->
	<script>
		const shotClockCountdown = document.getElementById('shot-clock-countdown');
		const shotClockFill = document.getElementById('shot-clock-fill');
		const shotClockGlow = document.getElementById('shot-clock-glow');
		const shotClockText = document.getElementById('shot-clock');
		const timeoutAnimation = document.getElementById('timeout-animation');
		const timeoutText = document.getElementById('timeout-text');
		const homeStatsAnimation = document.getElementById('home-stats-animation');
		const guestStatsAnimation = document.getElementById('guest-stats-animation');
		const homeFire = document.getElementById('home-fire');
		const guestFire = document.getElementById('guest-fire');

		let currentTimeoutAnimation = null;
		let timeoutAnimationState = 'hidden'; // Can be 'hidden', 'showing', or 'hiding'

		const defaultDigitNode = document.createElement('div');
		defaultDigitNode.classList.add('digit');
		for (let i = 0; i < 10; i++) {
			defaultDigitNode.innerHTML += i + '<br>';
		}

		// Add new variables for shot clock tracking
		let lastShotClockTime = null;
		let lastShotClockScale = 1;

		// Initialize tickers
		const homeTicker = createNumberTicker(document.getElementById('home-score'));
		const guestTicker = createNumberTicker(document.getElementById('guest-score'));
		const homeTimeoutDisplay = createTimeoutDisplay('home-timeouts');
		const guestTimeoutDisplay = createTimeoutDisplay('guest-timeouts');

		let lastHomeScore = 0;
		let lastGuestScore = 0;
		let lastHomeTimeouts = 0;
		let lastGuestTimeouts = 0;
		let lastHomeFouls = 0;
		let lastGuestFouls = 0;
		let firstUpdate = true; // don't fire score effects for the first value we receive

		// Unanswered-points streaks (drives the fire effect)
		const FIRE_STREAK = 10;
		let homeStreak = 0;
		let guestStreak = 0;

		// Stats animation state and tracking
		let currentHomeStatsAnimation = null;
		let currentGuestStatsAnimation = null;
		let lastHomeStats = null;
		let lastGuestStats = null;
		let homeStatsTimeout = null;
		let guestStatsTimeout = null;

		/* Score effects -----
		   Hook for scoring animations. 'side' is 'home' or 'guest', 'points' is how many were scored.
		   Sheen sweep across the plate + pop on the score digits. */
		function replayClass(el, cls, ms) {
			el.classList.remove(cls);
			void el.offsetWidth; // restart the animation
			el.classList.add(cls);
			setTimeout(() => el.classList.remove(cls), ms);
		}

		function scoreEffect(side, points) {
			replayClass(document.getElementById(side + '-plate'), 'scored', 1200);
			replayClass(document.getElementById(side + '-score'), 'pop', 1000);
		}

		/* On-fire effect */
		function setOnFire(side, on) {
			const el = side === 'home' ? homeFire : guestFire;
			if (!el) return;
			if (el.classList.contains('active') === on) return;

			el.classList.toggle('active', on);

			// Re-roll the flicker timings so every ignition looks a little different
			if (on) {
				el.querySelectorAll('.flame, .ember, .fire-glow').forEach(node => {
					node.style.animation = 'none';
					void node.offsetWidth;
					node.style.animation = '';
				});
			}
		}

		function updateStatsAnimation(statsElement, statsText, duration, isHome) {
			// If no stats or stats haven't changed, do nothing
			const currentStats = statsText.trim();
			const lastStats = isHome ? lastHomeStats : lastGuestStats;

			console.log("currentStats: " + currentStats, " lastStats: " + lastStats, " duration: " + duration);
			if (currentStats === lastStats) return;
			// Clear any existing timeouts
			if (isHome && homeStatsTimeout) {
				clearTimeout(homeStatsTimeout);
				homeStatsTimeout = null;
			} else if (!isHome && guestStatsTimeout) {
				clearTimeout(guestStatsTimeout);
				guestStatsTimeout = null;
			}

			// Update the tracked last stats
			if (isHome) {
				lastHomeStats = currentStats;
			} else {
				lastGuestStats = currentStats;
			}

			// If stats are empty, hide the element
			if (!currentStats) {
				const slideOutAnimation = statsElement.animate([
					{ clipPath: isHome ? 'inset(0% 0% 0% 0%)' : 'inset(0% 0% 0% 0%)' },
					{ clipPath: isHome ? 'inset(0% 100% 0% 0%)' : 'inset(0% 0% 0% 100%)' }
				], {
					duration: 1000,
					easing: 'ease-in',
					fill: 'forwards'
				});
				slideOutAnimation.onfinish = () => {
					statsElement.style.display = 'none';
				};
				return;
			}

			// Cancel any existing animation for this stats element
			if (isHome && currentHomeStatsAnimation) {
				currentHomeStatsAnimation.cancel();
			}
			if (!isHome && currentGuestStatsAnimation) {
				currentGuestStatsAnimation.cancel();
			}
			// Show the stats animation
			statsElement.style.display = 'block';

			// Animate sliding in
			const slideInAnimation = statsElement.animate([
				{ clipPath: isHome ? 'inset(0% 100% 0% 0%)' : 'inset(0% 0% 0% 100%)' },
				{ clipPath: isHome ? 'inset(0% 0% 0% 0%)' : 'inset(0% 0% 0% 0%)' }
			], {
				duration: 1000,
				easing: 'ease-out',
				fill: 'forwards'
			});

			// Store the current animation
			if (isHome) {
				currentHomeStatsAnimation = slideInAnimation;
			} else {
				currentGuestStatsAnimation = slideInAnimation;
			}

			// If duration is set (not infinite), schedule the hide animation
			if (duration > 0) {
				const hideTimeout = setTimeout(() => {
					const slideOutAnimation = statsElement.animate([
						{ clipPath: isHome ? 'inset(0% 0% 0% 0%)' : 'inset(0% 0% 0% 0%)' },
						{ clipPath: isHome ? 'inset(0% 100% 0% 0%)' : 'inset(0% 0% 0% 100%)' }
					], {
						duration: 1000,
						easing: 'ease-in',
						fill: 'forwards'
					});

					slideOutAnimation.onfinish = () => {
						statsElement.style.display = 'none';
					};

					// Store the current animation
					if (isHome) {
						currentHomeStatsAnimation = slideOutAnimation;
					} else {
						currentGuestStatsAnimation = slideOutAnimation;
					}
				}, duration * 1000);

				// Store the timeout
				if (isHome) {
					homeStatsTimeout = hideTimeout;
				} else {
					guestStatsTimeout = hideTimeout;
				}
			}
		}

		/* Strip call-outs (fouls / timeouts) */
		const STRIP_FX_MS = 1600; // must match the stripSwipe animation duration
		const STRIP_ALERT_TEXT = { foul: 'FOUL', timeout: 'TIMEOUT' };

		const stripFx = {
			home: {
				el: document.getElementById('home-strip-fx'),
				ids: ['home-tol-label', 'home-fls-label', 'home-timeouts', 'home-fouls'],
				timer: null
			},
			guest: {
				el: document.getElementById('guest-strip-fx'),
				ids: ['guest-tol-label', 'guest-fls-label', 'guest-timeouts', 'guest-fouls'],
				timer: null
			}
		};

		function playStripAlert(side, kind) {
			const fx = stripFx[side];
			if (!fx || !fx.el) return;

			const textEl = fx.el.querySelector('.fx-text');
			const text = STRIP_ALERT_TEXT[kind] || STRIP_ALERT_TEXT.foul;

			// Restart cleanly if an alert is already running
			clearTimeout(fx.timer);
			fx.el.classList.remove('active');
			void fx.el.offsetWidth; // reflow so the animation replays

			textEl.textContent = text;
			fx.el.classList.add('active');

			fx.ids.forEach(id => {
				const node = document.getElementById(id);
				if (node) node.classList.add('dimmed');
			});

			// Bring the TOL / FLS text back once the swipe has finished
			fx.timer = setTimeout(() => {
				fx.el.classList.remove('active');
				fx.ids.forEach(id => {
					const node = document.getElementById(id);
					if (node) node.classList.remove('dimmed');
				});
				fx.timer = null;
			}, STRIP_FX_MS);
		}

		// Single switch for the whole "shot clock is counting down" state:
		// shows/hides the inner fill and pulses the red ring + digits.
		function setShotClockActive(on) {
			shotClockCountdown.style.display = on ? 'block' : 'none';
			shotClockGlow.classList.toggle('active', on);
			shotClockText.classList.toggle('hot', on);
		}

		function updateShotClock(shotClockTime) {
			if (!shotClockTime || shotClockTime === '--' || shotClockTime === "") {
				setShotClockActive(false);
				lastShotClockTime = null;
				lastShotClockScale = 1;
				return;
			}

			const currentTime = parseInt(shotClockTime, 10) || 0;

			// No change from previous update
			if (currentTime === lastShotClockTime) return;

			// Initial state setup
			if (lastShotClockTime === null) {
				if (currentTime <= 10) {
					setShotClockActive(true);
					const targetScale = currentTime / 10;
					shotClockFill.style.transform = `scaleY(${targetScale})`;
					lastShotClockScale = targetScale;
				} else {
					setShotClockActive(false);
					lastShotClockScale = 1;
				}
				lastShotClockTime = currentTime;
				return;
			}

			// Determine if the change is a consecutive decrement
			const buffer = 1;
			const animate = currentTime >= lastShotClockTime - buffer && currentTime < lastShotClockTime;

			if (currentTime <= 10) {
				setShotClockActive(true);
				const targetScale = currentTime / 10;

				if (animate) {
					// Animate the scaleY transition
					shotClockFill.animate([
						{ transform: `scaleY(${lastShotClockScale})` },
						{ transform: `scaleY(${targetScale})` }
					], {
						duration: 1000,
						easing: 'linear',
						fill: 'forwards'
					});
				} else {
					// Update immediately without animation
					shotClockFill.style.transform = `scaleY(${targetScale})`;
				}
				lastShotClockScale = targetScale;
			} else {
				// Hide and reset when shot clock is above 10
				setShotClockActive(false);
				lastShotClockScale = 1;
			}

			lastShotClockTime = currentTime;
		}

		function updateTimeoutAnimation(timeoutClock) {
			const [minutes, seconds] = timeoutClock.split(':').map(parseFloat);
			const time = minutes * 60 + seconds;

			if (!time || time <= 0) {
				if (timeoutAnimationState === 'showing') {
					timeoutAnimation.style.display = 'block';
					if (currentTimeoutAnimation) {
						currentTimeoutAnimation.cancel();
					}

					currentTimeoutAnimation = timeoutAnimation.animate([
						{ clipPath: 'inset(0% 0% 0% 0%)' },
						{ clipPath: 'inset(100% 0% 0% 0%)' }
					], {
						duration: 2000,
						easing: 'ease-out',
						fill: 'forwards'
					});

					timeoutAnimationState = 'hiding';
					currentTimeoutAnimation.onfinish = () => {
						timeoutAnimation.style.display = 'none';
						timeoutAnimationState = 'hidden';
					};
				}
				return;
			}

			timeoutText.textContent = `Timeout: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

			if (timeoutAnimationState !== 'showing') {
				timeoutAnimation.style.display = 'block';
				if (currentTimeoutAnimation) {
					currentTimeoutAnimation.cancel();
				}

				currentTimeoutAnimation = timeoutAnimation.animate([
					{ clipPath: 'inset(100% 0% 0% 0%)' },
					{ clipPath: 'inset(0% 0% 0% 0%)' }
				], {
					duration: 2000,
					easing: 'ease-out',
					fill: 'forwards'
				});

				timeoutAnimationState = 'showing';
			}
		}

		function createTimeoutDisplay(elementId) {
			const element = document.getElementById(elementId);
			element.innerHTML = ''; // Clears any existing content, otherwise we just append a LOT more...oops
			let currentTimeouts = [];
			let isAnimating = false;

			function updateTimeouts(newCount) {
				newCount = parseInt(newCount) || 0;
				const previousCount = currentTimeouts.length;

				if (newCount === previousCount) return;

				// Clear existing timeouts first
				element.innerHTML = '';
				currentTimeouts = [];

				// Create all new timeout indicators
				for (let i = 0; i < newCount; i++) {
					const timeoutSpan = document.createElement('span');
					timeoutSpan.textContent = 'I ';
					element.appendChild(timeoutSpan);
					currentTimeouts.push(timeoutSpan);
				}

				// If we're removing timeouts and not currently animating
				if (newCount < previousCount && !isAnimating) {
					for (let i = newCount; i < previousCount; i++) {
						const timeoutSpan = document.createElement('span');
						timeoutSpan.textContent = 'I ';
						timeoutSpan.classList.add('blink');
						element.appendChild(timeoutSpan);

						isAnimating = true;
						setTimeout(() => {
							timeoutSpan.remove();
							isAnimating = false;
						}, 3000);
					}
				}
			}

			return { updateTimeouts };
		}

		const textTransformations = {
			"home-possession": {
				">": ">",
				"<": ">",
				"None": "",
				"": ""
			},
			"guest-possession": {
				">": "<",
				"<": "<",
				"None": "",
				"": ""
			}
		};

		function transformText(key, value) {
			if (textTransformations[key] && textTransformations[key][value] !== undefined) {
				return textTransformations[key][value];
			}
			return value;
		}

		function createNumberTicker(element) {
			let currentValue = 0;
			let digits = [];

			function generateDigits(amount) {
				for (let i = 0; i < amount; i++) {
					const digitNode = defaultDigitNode.cloneNode(true);
					digitNode.isNew = true; // Mark as new
					element.appendChild(digitNode);
					digits.unshift(digitNode); // Add to start of array
				}
			}

			function removeExtraDigits(targetLength) {
				while (digits.length > targetLength) {
					const digitToRemove = digits.shift(); // Remove from start of array
					element.removeChild(digitToRemove);
				}
			}

			function setValue(newValue) {
				const newNumber = parseInt(newValue, 10);

				if (newNumber === currentValue && newNumber !== 0) return;

				// Always show at least one digit (for zero)
				const reversedNumberString = String(newNumber).padStart(1, '0').split('').reverse().join('');

				// Handle adding or removing digits
				if (reversedNumberString.length > digits.length) {
					generateDigits(reversedNumberString.length - digits.length);
				} else if (reversedNumberString.length < digits.length) {
					removeExtraDigits(reversedNumberString.length);
				}

				digits.forEach((digit, index) => {
					const num = reversedNumberString[index] || '0';
					if (digit.isNew) {
						// Start new digit at 0 and animate to target
						digit.style.marginTop = '0em';
						void digit.offsetHeight; // Trigger reflow
						digit.style.marginTop = `-${num}em`;
						digit.isNew = false; // Mark as initialized
					} else {
						digit.style.marginTop = `-${num}em`;
					}
				});

				currentValue = newNumber;
			}

			// Initialize with current value
			const initialValue = parseInt(element.getAttribute('data-value'), 10) || 0;
			setValue(initialValue);

			return { setValue };
		}

		function updateScoreboard(data) {
			const initializing = firstUpdate; // don't fire call-outs on the first payload

			// Update scores with animation
			const homeScore = parseInt(data.home_score, 10) || 0;
			const guestScore = parseInt(data.guest_score, 10) || 0;

			if (homeScore !== lastHomeScore) {
				const delta = homeScore - lastHomeScore;
				if (!firstUpdate && delta > 0) {
					homeStreak += delta;
					guestStreak = 0;
				} else if (delta < 0) {
					// score correction - kill the streak
					homeStreak = 0;
				}
				homeTicker.setValue(homeScore);
				if (!firstUpdate && delta > 0) scoreEffect('home', delta);
				lastHomeScore = homeScore;
			}

			if (guestScore !== lastGuestScore) {
				const delta = guestScore - lastGuestScore;
				if (!firstUpdate && delta > 0) {
					guestStreak += delta;
					homeStreak = 0;
				} else if (delta < 0) {
					guestStreak = 0;
				}
				guestTicker.setValue(guestScore);
				if (!firstUpdate && delta > 0) scoreEffect('guest', delta);
				lastGuestScore = guestScore;
			}
			firstUpdate = false;

			// Light the plates on fire for an unanswered-point run
			setOnFire('home', homeStreak >= FIRE_STREAK);
			setOnFire('guest', guestStreak >= FIRE_STREAK);

			// Update clock
			document.getElementById('main-clock').textContent = data.clock;

			// Update period, make sure UPPERCASE is used for period_desc
			document.getElementById('period').textContent = (data.period_desc || '').toUpperCase() || data.period;

			// Update timeouts with animation
			const homeTimeouts = parseInt(data.home_timeouts, 10) || 0;
			const guestTimeouts = parseInt(data.guest_timeouts, 10) || 0;

			homeTimeoutDisplay.updateTimeouts(homeTimeouts);
			guestTimeoutDisplay.updateTimeouts(guestTimeouts);

			if (!initializing && homeTimeouts < lastHomeTimeouts) playStripAlert('home', 'timeout');
			if (!initializing && guestTimeouts < lastGuestTimeouts) playStripAlert('guest', 'timeout');

			lastHomeTimeouts = homeTimeouts;
			lastGuestTimeouts = guestTimeouts;

			// Update fouls with animation
			const homeFouls = parseInt(data.home_fouls, 10) || 0;
			const guestFouls = parseInt(data.guest_fouls, 10) || 0;

			// Home fouls animation
			if (homeFouls !== lastHomeFouls) {
				const element = document.getElementById('home-fouls');
				element.classList.add('blink');
				setTimeout(() => element.classList.remove('blink'), 6000);
				if (!initializing && homeFouls > lastHomeFouls) playStripAlert('home', 'foul');
			}
			// Guest fouls animation
			if (guestFouls !== lastGuestFouls) {
				const element = document.getElementById('guest-fouls');
				element.classList.add('blink');
				setTimeout(() => element.classList.remove('blink'), 6000);
				if (!initializing && guestFouls > lastGuestFouls) playStripAlert('guest', 'foul');
			}
			document.getElementById('home-fouls').textContent = homeFouls;
			document.getElementById('guest-fouls').textContent = guestFouls;
			lastHomeFouls = homeFouls;
			lastGuestFouls = guestFouls;

			// Update possession indicators
			document.getElementById('home-possession').textContent = transformText("home-possession", data.home_possession ? '>' : '');
			document.getElementById('guest-possession').textContent = transformText("guest-possession", data.guest_possession ? '>' : '');

			// Update shot clock and status
			shotClockText.textContent = data.shot_clock || '--';
			updateShotClock(data.shot_clock);

			// Update timeout animation
			updateTimeoutAnimation(data.timeout_clock);

			// Update home and guest team stats with durations
			const homeStats = data.home_stats;
			const guestStats = data.guest_stats;
			const homeStatsDuration = data.home_stats_duration;
			const guestStatsDuration = data.guest_stats_duration;
			const homeNewAnimation = data.home_new_animation;
			const guestNewAnimation = data.guest_new_animation;

			document.getElementById('home-stats-text').innerHTML = homeStats;  // Using innerHTML to support HTML formatting
			document.getElementById('guest-stats-text').innerHTML = guestStats;

			if (homeNewAnimation || homeStatsAnimation.style.display === 'none') {
				updateStatsAnimation(homeStatsAnimation, homeStats, homeStatsDuration, true);
			}
			if (guestNewAnimation || guestStatsAnimation.style.display === 'none') {
				updateStatsAnimation(guestStatsAnimation, guestStats, guestStatsDuration, false);
			}
		}

		function fetchData() {
			fetch('http://localhost:5000/data')
				.then(response => response.json())
				.then(data => {
					updateScoreboard(data);
				})
				.catch(error => console.error('Error fetching data:', error));
		}

		setInterval(fetchData, 250);
